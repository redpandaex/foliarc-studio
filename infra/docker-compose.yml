name: foliarc-studio

x-milvus-image: &milvus-image milvusdb/milvus:v3.0.5

services:
  # ============================================================================
  # Profile: core (Phase 0+ — Lightweight: ~200-300MB RAM)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: foliarc-postgres
    profiles: ["core", "app", "all"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-foliarc}
      POSTGRES_USER: ${POSTGRES_USER:-foliarc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-foliarc_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-foliarc} -d ${POSTGRES_DB:-foliarc}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: foliarc-redis
    profiles: ["core", "app", "all"]
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # Profile: rag (Phase 3+ — MinIO + etcd + Milvus Standalone + RabbitMQ)
  # ============================================================================
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: foliarc-rabbitmq
    profiles: ["rag", "all"]
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-foliarc}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-foliarc_dev_password}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      start_period: 20s
      retries: 5

  minio:
    image: milvusdb/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: foliarc-minio
    profiles: ["rag", "all"]
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3

  etcd:
    image: quay.io/coreos/etcd:v3.5.25
    container_name: foliarc-etcd
    profiles: ["rag", "all"]
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus-volume-init:
    image: *milvus-image
    container_name: foliarc-milvus-init
    profiles: ["rag", "all"]
    user: "0:0"
    network_mode: none
    read_only: true
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        uid="$$(id -u milvus)"
        gid="$$(id -g milvus)"
        marker="/var/lib/milvus/.milvus-volume-owner-$${uid}-$${gid}"
        if [ ! -e "$${marker}" ]; then
          chown -R "$${uid}:$${gid}" /var/lib/milvus
          touch "$${marker}"
          chown "$${uid}:$${gid}" "$${marker}"
        fi
    volumes:
      - milvus_data:/var/lib/milvus

  milvus:
    image: *milvus-image
    container_name: foliarc-milvus
    profiles: ["rag", "all"]
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      MINIO_REGION: us-east-1
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "${MILVUS_PORT:-19530}:19530"
      - "${MILVUS_METRICS_PORT:-9091}:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      milvus-volume-init:
        condition: service_completed_successfully
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3

  # ============================================================================
  # Profile: app (Containerized Application Stack: agent-py + biz-java + web)
  # ============================================================================
  agent-py:
    build:
      context: ../services/agent-py
      dockerfile: Dockerfile
    container_name: foliarc-agent-py
    profiles: ["app", "all"]
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      AGENT_PY_HOST: 0.0.0.0
      AGENT_PY_PORT: "8000"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      BIZ_JAVA_BASE_URL: http://biz-java:8080
      FOLIARC_SKILLS_DIR: /app/skills
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      MINIO_ENDPOINT: http://minio:9000
      MILVUS_HOST: milvus
      MILVUS_PORT: "19530"
      SANDBOX_PROVIDER: ${SANDBOX_PROVIDER:-docker}
      SANDBOX_DOCKER_IMAGE: ${SANDBOX_DOCKER_IMAGE:-python:3.12-slim}
      SANDBOX_DOCKER_RUNTIME: ${SANDBOX_DOCKER_RUNTIME:-}
    group_add:
      - "${DOCKER_GID:-1001}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "${AGENT_PY_PORT:-8000}:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3

  biz-java:
    build:
      context: ../services/java
      dockerfile: biz-java/Dockerfile
    container_name: foliarc-biz-java
    profiles: ["app", "all"]
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      BIZ_JAVA_PORT: "8080"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      AGENT_PY_BASE_URL: http://agent-py:8000
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      MINIO_ENDPOINT: http://minio:9000
    ports:
      - "${BIZ_JAVA_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      agent-py:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/v1/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
    container_name: foliarc-web
    profiles: ["app", "all"]
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      biz-java:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3

  # ============================================================================
  # Profile: admin (Phase 6 — Independent Operations Admin Stack: admin-java + admin)
  # ============================================================================
  admin-java:
    build:
      context: ../services/java
      dockerfile: admin-java/Dockerfile
    container_name: foliarc-admin-java
    profiles: ["admin", "all"]
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      ADMIN_JAVA_PORT: "8081"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      AGENT_PY_BASE_URL: http://agent-py:8000
      ADMIN_CORS_ALLOWED_ORIGINS: ${ADMIN_CORS_ALLOWED_ORIGINS:-http://localhost:3001}
      SPRING_FLYWAY_ENABLED: "false"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      MINIO_ENDPOINT: http://minio:9000
    ports:
      - "${ADMIN_JAVA_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/api/v1/admin/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

  admin:
    build:
      context: ../apps/admin
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_ADMIN_API_BASE_URL: ${NEXT_PUBLIC_ADMIN_API_BASE_URL:-http://localhost:8081}
    container_name: foliarc-admin
    profiles: ["admin", "all"]
    restart: unless-stopped
    ports:
      - "${ADMIN_WEB_PORT:-3001}:3001"
    depends_on:
      admin-java:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/api/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  pg_data:
  redis_data:
  rabbitmq_data:
  minio_data:
  etcd_data:
  milvus_data:
