worker_processes auto;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 30m;

    map $http_x_trace_id $resolved_trace_id {
        default $http_x_trace_id;
        ""      $request_id;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    log_format gateway_json escape=json
        '{"time":"$time_iso8601",'
        '"trace_id":"$resolved_trace_id",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$uri",'
        '"status":$status,'
        '"bytes_sent":$bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"upstream_response_time":"$upstream_response_time",'
        '"limit_req_status":"$limit_req_status",'
        '"user_agent":"$http_user_agent"}';

    access_log /dev/stdout gateway_json;

    limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=auth_per_ip:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=web_per_ip:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=sse_conn_per_ip:10m;

    limit_req_status 429;
    limit_conn_status 429;

    upstream web_app {
        server web:3000;
        keepalive 32;
    }

    upstream biz_java {
        server biz-java:8080;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        error_page 429 = @rate_limited;

        location @rate_limited {
            default_type application/json;
            add_header Retry-After 5 always;
            add_header X-Trace-Id $resolved_trace_id always;
            return 429 '{"code":"GATEWAY_RATE_LIMIT","message":"请求过于频繁，已被入口网关限流，请稍后再试"}';
        }

        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # SSE stream endpoint: disable buffering and extend read timeout
        location ~ ^/api/v1/runs/[^/]+/stream$ {
            limit_conn sse_conn_per_ip 10;

            proxy_pass http://biz_java;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Trace-Id $resolved_trace_id;

            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Auth endpoints: tighter brute-force / credential stuffing protection
        location ^~ /api/v1/auth/ {
            limit_req zone=auth_per_ip burst=15 nodelay;

            proxy_pass http://biz_java;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Trace-Id $resolved_trace_id;
        }

        # General backend API routes
        location ^~ /api/v1/ {
            limit_req zone=api_per_ip burst=60 nodelay;

            proxy_pass http://biz_java;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Trace-Id $resolved_trace_id;
            proxy_read_timeout 120s;
        }

        # Next.js web health endpoint (must route to web_app, not biz_java)
        location = /api/health {
            access_log off;

            proxy_pass http://web_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Trace-Id $resolved_trace_id;
        }

        # Author frontend pages and Next.js static assets
        location / {
            limit_req zone=web_per_ip burst=80 nodelay;

            proxy_pass http://web_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Trace-Id $resolved_trace_id;
        }
    }
}
