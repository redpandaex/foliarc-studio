[project]
name = "inkflow-agent"
version = "0.1.0"
description = "InkFlow Studio Python Agent & Hybrid RAG Engine"
readme = "README.md"
authors = [
    { name = "redpandaex", email = "lxw.tech.dev@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "mcp>=2.3.0",
    "pydantic-settings>=2.16.3",
    "redis>=8.1.0",
    "tiktoken>=0.14.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
inkflow-agent = "inkflow_agent:main"
novel-lore-mcp = "inkflow_agent.mcp_server.novel_lore_server:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
