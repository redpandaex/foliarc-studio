spring:
  application:
    name: biz-java
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:inkflow}
    username: ${POSTGRES_USER:inkflow}
    password: ${POSTGRES_PASSWORD:inkflow_dev_password}
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

mybatis-plus:
  type-handlers-package: studio.inkflow.biz.config.mybatis
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

server:
  port: ${BIZ_JAVA_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

inkflow:
  agent:
    base-url: ${AGENT_PY_BASE_URL:http://localhost:8000}
    internal-token: ${INTERNAL_SERVICE_TOKEN:inkflow-internal-dev-token-change-me}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET:inkflow-dev-jwt-secret-change-me-at-least-32-chars}
    issuer: inkflow-studio
    access-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:900}
    refresh-ttl-seconds: ${JWT_REFRESH_TTL_SECONDS:604800}
    cookie-secure: ${JWT_COOKIE_SECURE:false}
