spring:
  application:
    name: biz-java
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:foliarc}
    username: ${POSTGRES_USER:foliarc}
    password: ${POSTGRES_PASSWORD:foliarc_dev_password}
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:foliarc}
    password: ${RABBITMQ_PASSWORD:foliarc_dev_password}
    publisher-confirm-type: correlated
    publisher-returns: true
    connection-timeout: 5s
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB

mybatis-plus:
  type-handlers-package: studio.foliarc.biz.config.mybatis
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

server:
  port: ${BIZ_JAVA_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

foliarc:
  agent:
    base-url: ${AGENT_PY_BASE_URL:http://localhost:8000}
    internal-token: ${INTERNAL_SERVICE_TOKEN:foliarc-internal-dev-token-change-me}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET:foliarc-dev-jwt-secret-change-me-at-least-32-chars}
    issuer: foliarc-studio
    access-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:900}
    refresh-ttl-seconds: ${JWT_REFRESH_TTL_SECONDS:604800}
    cookie-secure: ${JWT_COOKIE_SECURE:false}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ROOT_USER:minioadmin}
    secret-key: ${MINIO_ROOT_PASSWORD:minioadmin}
    bucket-docs: ${MINIO_BUCKET_DOCS:foliarc-docs}
  outbox:
    enabled: ${OUTBOX_RELAY_ENABLED:true}
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:1000}
    max-retries: ${OUTBOX_MAX_RETRIES:6}
